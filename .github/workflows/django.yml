name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.9, "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Display Python version
      run: python -c "import sys; print(sys.version)"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
          echo "✓ Dependencies installed from requirements.txt"
        else
          echo "⚠ Warning: requirements.txt not found"
          pip install django djangorestframework python-dotenv azure-storage-blob
        fi

    - name: Check Django Project Structure
      run: |
        echo "Checking for manage.py..."
        if [ -f manage.py ]; then
          echo "✓ manage.py found"
          python manage.py --version
        else
          echo "⚠ Warning: manage.py not found in repository root"
          echo "Repository structure:"
          ls -la
        fi

    - name: Run Django Tests
      run: |
        if [ -f manage.py ]; then
          echo "Running Django tests..."
          python manage.py test --verbosity=2
        else
          echo "⚠ Skipping Django tests: manage.py not found"
          echo "To enable tests, ensure your Django project is properly structured"
        fi

    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Workflow Status Summary
      if: always()
      run: |
        echo "=========================================="
        echo "Workflow Execution Summary"
        echo "=========================================="
        echo "✓ Python version: ${{ matrix.python-version }}"
        echo "✓ Runner OS: ubuntu-latest"
        echo "✓ Checkout completed"
        echo "=========================================="
